<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .outer{
            height: 400px;
            width: 400px;
            border: 2px solid rgb(24, 5, 5);
            
        }
        .outer > .circle{
            height: 100px;
            width: 100px;
            border: 2px solid blue;
            border-radius: 50%;

            animation: roatation 3s linear infinite;
        }
        @keyframes roatation {
            from{
                transform: translateX(300px);

            }
            to{
                transform: translateY(300px);

            }
            
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="circle"></div>

    </div>
    
</body>
</html>
